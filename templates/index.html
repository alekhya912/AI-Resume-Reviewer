<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <title>AI Resume Reviewer</title>
    </head>
    <body>
        <h1>AI Resume Reviewer</h1>
        <p>Upload your resume and enter a job description to analyse your profile.</p>
        
        <form action="/analyze" method="POST" enctype="multipart/form-data">
             <h3>Upload Your Resume</h3>
            <input type="file" name="resume" accept=".pdf" required>

            <h3>Enter Job Description</h3>
            <textarea name="job_description" rows="10" cols="50"
                placeholder="Paste the job description here..."
                required></textarea>
            <br><br>
            <button type="submit">Analyse Resume</button>
        </form>
        
    </body>
</html>
